/**:
  ros__parameters:
    # LiDAR 座標（front_lower/lidar）で CropBox。点群の frame_id と一致するので TF 不要
    input_frame: "front_lower/lidar"
    output_frame: "front_lower/lidar"
    # CropBox 範囲 [m]、LiDAR 座標。(0.30,-0.97,-0.05) と (-0.25,-0.68,-0.28) を囲む範囲＋10cmマージン
    min_x: -0.34623
    max_x: 0.39976
    min_y: -1.06525
    max_y: -0.58475
    min_z: -0.38086
    max_z: 0.049259
    # false: 範囲内の点を残す / true: 範囲内の点を除去する
    negative: false
    processing_time_threshold_sec: 0.05
